<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>eywa.lol — Log in</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/loader.css" />
<style>
body { display: flex; flex-direction: column; min-height: 100vh; }

.auth-wrap {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 48px 20px; position: relative; z-index: 1;
}
.auth-card {
  width: 400px; max-width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 44px 40px 36px;
}
.auth-brand {
  display: flex; flex-direction: column; align-items: center;
  gap: 10px; margin-bottom: 36px; text-align: center;
}
.auth-logo-mark {
  width: 52px; height: 52px; border-radius: 14px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
}
.auth-logo-mark svg { width: 24px; height: 24px; stroke: #f8f7ff; }
.auth-name { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); }
.auth-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); }

.auth-form { display: flex; flex-direction: column; gap: 18px; }
.auth-form .btn-primary { padding: 12px; margin-top: 4px; justify-content: center; width: 100%; }

.auth-error {
  font-size: 12px; color: #f87171;
  font-family: var(--mono); min-height: 16px; text-align: center;
}
.auth-footer {
  margin-top: 28px; text-align: center;
  font-size: 13px; color: var(--muted);
}
.auth-footer a { color: var(--accent); }
.auth-footer a:hover { text-decoration: underline; }

.auth-divider {
  display: flex; align-items: center; gap: 12px;
  color: var(--dim); font-size: 12px; margin: 4px 0;
}
.auth-divider::before, .auth-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

.btn-discord {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 11px; border-radius: 8px;
  background: rgba(88,101,242,0.1); border: 1px solid rgba(88,101,242,0.25);
  color: #7289da; font-size: 13.5px; font-weight: 600;
  cursor: pointer; transition: background 0.15s, border-color 0.15s;
  text-decoration: none;
}
.btn-discord:hover { background: rgba(88,101,242,0.18); border-color: rgba(88,101,242,0.45); color: #7289da; }
.btn-discord svg { width: 18px; height: 18px; fill: #7289da; flex-shrink: 0; }

.shake { animation: shake 0.4s; }
@keyframes shake {
  10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(3px)}
  30%,50%,70%{transform:translateX(-4px)} 40%,60%{transform:translateX(4px)}
}

/* logged-in redirect state */
.redirecting { text-align: center; padding: 20px 0; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<nav class="main-nav scrolled">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f8f7ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </div>
      eywa.lol
    </a>
    <div class="nav-cta">
      <span style="font-size:13px;color:var(--muted)">No account?</span>
      <a href="register.html" class="btn btn-primary btn-sm">Sign up free</a>
    </div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card" id="authCard">
    <div class="auth-brand">
      <div class="auth-logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </div>
      <div class="auth-name">eywa.lol</div>
      <div class="auth-sub">Welcome back</div>
    </div>

    <div class="auth-form" id="authForm">
      <a href="/api/auth/discord" class="btn-discord">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.042.03.052a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
        </svg>
        Continue with Discord
      </a>

      <div class="auth-divider">or</div>

      <div class="field">
        <label for="loginField">Email or username</label>
        <input type="text" id="loginField" placeholder="you@example.com" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password" style="display:flex;justify-content:space-between;align-items:center;">
          <span>Password</span>
          <a href="forgot-password.html" style="text-transform:none;font-weight:500;letter-spacing:0;color:var(--muted);font-family:inherit;font-size:12px;">Forgot password?</a>
        </label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div class="auth-error" id="authError"></div>
      <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">Log in</button>
    </div>

    <div class="auth-form" id="login2faForm" style="display:none;">
      <div style="text-align:center;font-size:13px;color:var(--muted);margin-bottom:4px;">
        We sent a 6-digit code to <strong id="login2faEmailDisplay" style="color:var(--text)"></strong>.
      </div>
      <div class="field">
        <label for="login2faCode">Verification code</label>
        <input type="text" id="login2faCode" placeholder="123456" maxlength="6" inputmode="numeric"
               autocomplete="one-time-code" style="letter-spacing:6px;text-align:center;font-size:18px;" />
      </div>
      <div class="auth-error" id="login2faError"></div>
      <button class="btn btn-primary" id="login2faBtn" onclick="doVerify2FALogin()">Verify &amp; log in</button>
      <div style="text-align:center;font-size:12.5px;margin-top:4px;">
        <a href="#" onclick="backToLoginForm();return false;">Back to login</a>
      </div>
    </div>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Sign up free →</a>
    </div>
  </div>
</div>

<footer class="main-footer">
  <div class="footer-inner" style="max-width:1100px;margin:0 auto;padding:0 32px;">
    <span class="footer-copy">© 2026 eywa.lol</span>
    <div class="footer-links">
      <a href="terms.html" class="footer-link">Terms</a>
      <a href="privacy.html" class="footer-link">Privacy</a>
    </div>
  </div>
</footer>

<script src="js/loader.js"></script>
<script>
// If already logged in, go straight to dashboard
if (localStorage.getItem('eywa_token')) {
  navigateTo('/dashboard', 'Going to dashboard');
}

// Handle Discord OAuth token in URL (from callback redirect)
const urlParams = new URLSearchParams(window.location.search);
const urlToken = urlParams.get('token');
if (urlToken) {
  localStorage.setItem('eywa_token', urlToken);
  navigateTo('/dashboard', 'Logging you in');
}

// Handle errors from OAuth
const oauthError = urlParams.get('error');
if (oauthError) {
  document.getElementById('authError').textContent =
    oauthError === 'discord_failed' ? 'Discord login failed. Try again.' : 'Login error. Try again.';
}

async function doLogin() {
  const login = document.getElementById('loginField').value.trim();
  const pass  = document.getElementById('password').value;
  const err   = document.getElementById('authError');
  const btn   = document.getElementById('loginBtn');
  const card  = document.getElementById('authCard');

  err.textContent = '';

  if (!login || !pass) {
    err.textContent = 'Please fill in all fields.';
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
    return;
  }

  btn.textContent = 'Logging in…';
  btn.disabled = true;
  showLoader('Signing you in');

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login, password: pass }),
    });
    const data = await res.json();

    if (!res.ok) {
      hideLoader();
      err.textContent = data.error || 'Login failed.';
      btn.textContent = 'Log in';
      btn.disabled = false;
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      return;
    }

    if (data.requires2fa) {
      hideLoader();
      pendingLoginEmail = data.email;
      btn.textContent = 'Log in';
      btn.disabled = false;
      document.getElementById('authForm').style.display = 'none';
      document.getElementById('login2faForm').style.display = 'flex';
      document.getElementById('login2faEmailDisplay').textContent = data.email;
      document.getElementById('login2faCode').value = '';
      document.getElementById('login2faCode').focus();
      return;
    }

    // ✅ Save token + username, then navigate
    localStorage.setItem('eywa_token', data.token);
    localStorage.setItem('eywa_username', data.username);
    navigateTo('/dashboard', 'Welcome back');
  } catch (e) {
    hideLoader();
    err.textContent = 'Network error. Check your connection.';
    btn.textContent = 'Log in';
    btn.disabled = false;
  }
}

let pendingLoginEmail = '';

function backToLoginForm() {
  document.getElementById('login2faForm').style.display = 'none';
  document.getElementById('authForm').style.display = 'flex';
}

async function doVerify2FALogin() {
  const code = document.getElementById('login2faCode').value.trim();
  const err  = document.getElementById('login2faError');
  const btn  = document.getElementById('login2faBtn');
  const card = document.getElementById('authCard');

  err.textContent = '';

  if (!/^[0-9]{6}$/.test(code)) {
    err.textContent = 'Enter the 6-digit code from your email.';
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
    return;
  }

  btn.textContent = 'Verifying…';
  btn.disabled = true;
  showLoader('Verifying code');

  try {
    const res = await fetch('/api/auth/login/verify-2fa', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: pendingLoginEmail, code }),
    });
    const data = await res.json();

    if (!res.ok) {
      hideLoader();
      err.textContent = data.error || 'Something went wrong.';
      btn.textContent = 'Verify & log in';
      btn.disabled = false;
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      return;
    }

    localStorage.setItem('eywa_token', data.token);
    localStorage.setItem('eywa_username', data.username);
    navigateTo('/dashboard', 'Welcome back');
  } catch (e) {
    hideLoader();
    err.textContent = 'Network error. Try again.';
    btn.textContent = 'Verify & log in';
    btn.disabled = false;
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' &&
      (document.activeElement === document.getElementById('loginField') ||
       document.activeElement === document.getElementById('password'))) {
    doLogin();
  }
  if (e.key === 'Enter' && document.activeElement === document.getElementById('login2faCode')) {
    doVerify2FALogin();
  }
});
</script>
</body>
</html>
