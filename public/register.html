<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>eywa.lol — Create your page</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/loader.css" />
<style>
body { display: flex; flex-direction: column; min-height: 100vh; }

.auth-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 20px;
  position: relative; z-index: 1;
}

.auth-card {
  width: 420px;
  max-width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: 18px;
  padding: 44px 40px 36px;
}

.auth-brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-bottom: 32px;
  text-align: center;
}

.auth-logo-mark {
  width: 52px; height: 52px;
  border-radius: 14px;
  background: linear-gradient(145deg, rgba(94,234,212,0.18), transparent);
  border: 1px solid var(--accent-dim);
  display: flex; align-items: center; justify-content: center;
}
.auth-logo-mark svg { width: 24px; height: 24px; stroke: var(--accent); }

.auth-name {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text);
}

.auth-sub { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); letter-spacing: 0.05em; }

.auth-form { display: flex; flex-direction: column; gap: 16px; }
.auth-form .btn-primary { padding: 12px; margin-top: 4px; }

.auth-error {
  font-size: 12px;
  color: var(--danger);
  font-family: var(--font-mono);
  min-height: 16px;
  text-align: center;
}

.auth-footer {
  margin-top: 24px;
  text-align: center;
  font-size: 13px;
  color: var(--text-dim);
}
.auth-footer a { color: var(--accent); text-decoration: none; }
.auth-footer a:hover { text-decoration: underline; }

.auth-divider {
  display: flex; align-items: center; gap: 12px;
  color: var(--text-dim); font-size: 12px; margin: 2px 0;
}
.auth-divider::before, .auth-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

.btn-social {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 10px;
  background: rgba(88,101,242,0.1);
  border: 1px solid rgba(88,101,242,0.25);
  color: #7289da; border-radius: 8px;
  font-size: 13.5px; font-weight: 600; cursor: pointer;
  transition: background 0.15s, border-color 0.15s; text-decoration: none;
}
.btn-social:hover { background: rgba(88,101,242,0.18); border-color: rgba(88,101,242,0.4); color: #7289da; }
.btn-social svg { width: 18px; height: 18px; fill: #7289da; }

/* Username availability indicator */
.field-row { position: relative; }
.field-row input { padding-right: 36px; }

.u-status {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 11px;
  font-family: var(--font-mono);
  font-weight: 600;
  letter-spacing: 0.04em;
  pointer-events: none;
}
.u-status.available { color: var(--accent); }
.u-status.taken     { color: var(--danger); }
.u-status.checking  { color: var(--text-dim); }

.field-hint {
  font-size: 11px;
  color: var(--text-dim);
  font-family: var(--font-mono);
  margin-top: -8px;
}

.shake { animation: shake 0.4s; }
@keyframes shake {
  10%,90%{transform:translateX(-1px)} 20%,80%{transform:translateX(2px)}
  30%,50%,70%{transform:translateX(-4px)} 40%,60%{transform:translateX(4px)}
}
</style>
</head>
<body>

<nav class="main-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
      <span class="logo-word">eywa.lol</span>
    </a>
    <div class="nav-cta">
      <span style="font-size:13px;color:var(--text-muted);">Already have an account?</span>
      <a href="login.html" class="btn btn-ghost btn-sm">Log in</a>
    </div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card" id="authCard">
    <div class="auth-brand">
      <div class="auth-logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </div>
      <div class="auth-name">eywa.lol</div>
      <div class="auth-sub">Claim your free page</div>
    </div>

    <div class="auth-form" id="authForm">

      <a href="/api/auth/discord" class="btn-social">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.042.03.052a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
        </svg>
        Continue with Discord
      </a>

      <div class="auth-divider">or</div>

      
      <div class="field">
        <label for="username">Username</label>
        <div class="field-row">
          <input type="text" id="username" placeholder="yourname" autocomplete="off"
                 maxlength="20" oninput="onUsernameInput()" />
          <span class="u-status" id="uStatus"></span>
        </div>
        <div class="field-hint" id="uHint">eywa.lol/<span id="uPreview">yourname</span></div>
      </div>

      
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      </div>

      
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Min 8 characters" autocomplete="new-password" />
      </div>

      
      <div class="field">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" placeholder="••••••••" autocomplete="new-password" />
      </div>

      <div class="auth-error" id="authError"></div>

      <button class="btn btn-primary btn-full" id="registerBtn" onclick="doRegister()">
        Send verification code →
      </button>
    </div>

    
    <div class="auth-form" id="codeForm" style="display:none;">
      <div style="text-align:center;font-size:13px;color:var(--text-dim);margin-bottom:4px;">
        We sent a 6-digit code to <strong id="codeEmailDisplay" style="color:var(--text)"></strong>.
        Enter it below to finish creating your account.
      </div>

      <div class="field">
        <label for="verifyCode">Verification code</label>
        <input type="text" id="verifyCode" placeholder="123456" maxlength="6" inputmode="numeric"
               autocomplete="one-time-code" style="letter-spacing:6px;text-align:center;font-size:18px;" />
      </div>

      <div class="auth-error" id="codeError"></div>

      <button class="btn btn-primary btn-full" id="verifyBtn" onclick="doVerifyCode()">
        Verify &amp; create account →
      </button>

      <div style="text-align:center;font-size:12.5px;">
        Didn't get it? <a href="#" id="resendLink" onclick="resendCode();return false;">Resend code</a>
        &nbsp;·&nbsp;
        <a href="#" onclick="backToForm();return false;">Edit details</a>
      </div>
    </div>

    <div class="auth-footer" id="authFooter">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>
</div>

<footer class="main-footer">
  <div class="wrap footer-inner">
    <span class="footer-copy">© 2026 eywa.lol</span>
    <div class="footer-links">
      <a href="terms.html" class="footer-link">Terms</a>
      <a href="privacy.html" class="footer-link">Privacy</a>
    </div>
  </div>
</footer>

<script src="js/loader.js"></script>
<script>
let checkTimer = null;
const USERNAME_RE = /^[a-zA-Z0-9_-]{3,20}$/;

function setStatus(type, text) {
  const el = document.getElementById('uStatus');
  el.className = 'u-status ' + type;
  el.textContent = text;
}

function onUsernameInput() {
  const val = document.getElementById('username').value.trim();
  document.getElementById('uPreview').textContent = val || 'yourname';
  usernameOk = false;
  clearTimeout(checkTimer);
  setStatus('', '');

  if (!val) return;
  if (!USERNAME_RE.test(val)) {
    setStatus('taken', '✗');
    return;
  }

  setStatus('checking', '…');
  checkTimer = setTimeout(() => checkUsername(val), 400);
}

async function checkUsername(username) {
  try {
    const res = await fetch(`/api/auth/check/${encodeURIComponent(username)}`);
    const data = await res.json();
    if (data.available) {
      setStatus('available', '✓');
      usernameOk = true;
    } else {
      setStatus('taken', '✗');
      usernameOk = false;
    }
  } catch {
    setStatus('', '');
  }
}

let pendingEmail = '', pendingUsername = '', pendingPassword = '';

async function doRegister() {
  const username = document.getElementById('username').value.trim();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirm  = document.getElementById('confirm').value;
  const err      = document.getElementById('authError');
  const card     = document.getElementById('authCard');
  const btn      = document.getElementById('registerBtn');

  const shake = () => {
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
  };

  err.textContent = '';

  if (!username || !email || !password || !confirm) {
    err.textContent = 'Please fill in all fields.'; shake(); return;
  }
  if (!usernameOk) {
    err.textContent = 'Choose a valid, available username.'; shake(); return;
  }
  if (password.length < 8) {
    err.textContent = 'Password must be at least 8 characters.'; shake(); return;
  }
  if (password !== confirm) {
    err.textContent = 'Passwords do not match.'; shake(); return;
  }

  btn.textContent = 'Sending code…';
  btn.disabled = true;

  try {
    const res = await fetch('/api/auth/register/request-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password }),
    });
    const data = await res.json();

    if (!res.ok) {
      err.textContent = data.error || 'Something went wrong.';
      shake();
      btn.textContent = 'Send verification code →';
      btn.disabled = false;
      return;
    }

    pendingEmail = email;
    pendingUsername = username;
    pendingPassword = password;

    document.getElementById('authForm').style.display = 'none';
    document.getElementById('authFooter').style.display = 'none';
    document.getElementById('codeForm').style.display = 'flex';
    document.getElementById('codeEmailDisplay').textContent = email;
    document.getElementById('codeError').textContent = '';
    document.getElementById('verifyCode').value = '';
    document.getElementById('verifyCode').focus();

    btn.textContent = 'Send verification code →';
    btn.disabled = false;
  } catch {
    err.textContent = 'Network error. Try again.';
    btn.textContent = 'Send verification code →';
    btn.disabled = false;
  }
}

async function doVerifyCode() {
  const code = document.getElementById('verifyCode').value.trim();
  const err  = document.getElementById('codeError');
  const card = document.getElementById('authCard');
  const btn  = document.getElementById('verifyBtn');

  const shake = () => {
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
  };

  err.textContent = '';

  if (!/^[0-9]{6}$/.test(code)) {
    err.textContent = 'Enter the 6-digit code from your email.'; shake(); return;
  }

  btn.textContent = 'Verifying…';
  btn.disabled = true;

  try {
    const res = await fetch('/api/auth/register/verify-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: pendingEmail, code }),
    });
    const data = await res.json();

    if (!res.ok) {
      err.textContent = data.error || 'Something went wrong.';
      shake();
      btn.textContent = 'Verify & create account →';
      btn.disabled = false;
      return;
    }

    localStorage.setItem('eywa_token', data.token);
    localStorage.setItem('eywa_username', data.username);
    navigateTo('/dashboard', 'Setting up your profile');
  } catch {
    err.textContent = 'Network error. Try again.';
    btn.textContent = 'Verify & create account →';
    btn.disabled = false;
  }
}

async function resendCode() {
  const link = document.getElementById('resendLink');
  const err  = document.getElementById('codeError');
  if (!pendingEmail) return;

  link.textContent = 'Sending…';
  try {
    const res = await fetch('/api/auth/register/request-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: pendingUsername, email: pendingEmail, password: pendingPassword }),
    });
    const data = await res.json();
    if (!res.ok) {
      err.textContent = data.error || 'Could not resend code.';
    } else {
      err.textContent = '';
      err.style.color = 'var(--accent)';
      err.textContent = 'A new code was sent.';
      setTimeout(() => { err.style.color = ''; err.textContent = ''; }, 3000);
    }
  } catch {
    err.textContent = 'Network error. Try again.';
  }
  link.textContent = 'Resend code';
}

function backToForm() {
  document.getElementById('codeForm').style.display = 'none';
  document.getElementById('authForm').style.display = 'flex';
  document.getElementById('authFooter').style.display = 'block';
  document.getElementById('codeError').textContent = '';
}

// Pre-fill username from URL param (?name=xyz coming from the landing page hero)
const params = new URLSearchParams(location.search);
const prefill = params.get('name');
if (prefill) {
  document.getElementById('username').value = prefill;
  onUsernameInput();
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const codeVisible = document.getElementById('codeForm').style.display !== 'none';
  if (codeVisible) doVerifyCode(); else doRegister();
});
</script>
</body>
</html>
