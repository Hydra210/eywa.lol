<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>eywa.lol — Reset your password</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/loader.css" />
<style>
body { display: flex; flex-direction: column; min-height: 100vh; }

.auth-wrap {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 48px 20px; position: relative; z-index: 1;
}
.auth-card {
  width: 400px; max-width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 44px 40px 36px;
}
.auth-brand {
  display: flex; flex-direction: column; align-items: center;
  gap: 10px; margin-bottom: 28px; text-align: center;
}
.auth-logo-mark {
  width: 52px; height: 52px; border-radius: 14px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
}
.auth-logo-mark svg { width: 24px; height: 24px; stroke: #f8f7ff; }
.auth-name { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); }
.auth-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: center; line-height: 1.5; margin-top: 2px; }

.auth-form { display: flex; flex-direction: column; gap: 18px; }
.auth-form .btn-primary { padding: 12px; margin-top: 4px; justify-content: center; width: 100%; }

.auth-error { font-size: 12px; color: #f87171; font-family: var(--mono); min-height: 16px; text-align: center; }
.auth-success { font-size: 12px; color: var(--accent); font-family: var(--mono); min-height: 16px; text-align: center; }
.auth-footer { margin-top: 28px; text-align: center; font-size: 13px; color: var(--muted); }
.auth-footer a { color: var(--accent); }
.auth-footer a:hover { text-decoration: underline; }

.shake { animation: shake 0.4s; }
@keyframes shake {
  10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(3px)}
  30%,50%,70%{transform:translateX(-4px)} 40%,60%{transform:translateX(4px)}
}
</style>
</head>
<body>

<nav class="main-nav scrolled">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f8f7ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </div>
      eywa.lol
    </a>
    <div class="nav-cta">
      <span style="font-size:13px;color:var(--muted)">Remembered it?</span>
      <a href="login.html" class="btn btn-primary btn-sm">Log in</a>
    </div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card" id="authCard">
    <div class="auth-brand">
      <div class="auth-logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </div>
      <div class="auth-name">Reset password</div>
      <div class="auth-sub" id="stepSub">Enter your account email and we'll send you a code.</div>
    </div>

    
    <div class="auth-form" id="emailForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="auth-error" id="emailError"></div>
      <button class="btn btn-primary" id="sendBtn" onclick="requestCode()">Send reset code</button>
    </div>

    
    <div class="auth-form" id="resetForm" style="display:none;">
      <div class="field">
        <label for="code">Code from email</label>
        <input type="text" id="code" placeholder="123456" maxlength="6" inputmode="numeric"
               autocomplete="one-time-code" style="letter-spacing:6px;text-align:center;font-size:18px;" />
      </div>
      <div class="field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" placeholder="Min 8 characters" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password" />
      </div>
      <div class="auth-error" id="resetError"></div>
      <button class="btn btn-primary" id="resetBtn" onclick="doReset()">Reset password</button>
      <div style="text-align:center;font-size:12.5px;color:var(--muted);">
        Didn't get it? <a href="#" onclick="requestCode(true);return false;" style="color:var(--accent)">Resend code</a>
        &nbsp;·&nbsp;
        <a href="#" onclick="backToEmail();return false;" style="color:var(--accent)">Use a different email</a>
      </div>
    </div>

    
    <div class="auth-form" id="doneForm" style="display:none;">
      <div class="auth-success" style="font-size:14px;">Your password has been reset.</div>
      <a href="login.html" class="btn btn-primary" style="text-align:center;">Log in →</a>
    </div>

    <div class="auth-footer">
      <a href="login.html">← Back to log in</a>
    </div>
  </div>
</div>

<footer class="main-footer">
  <div class="footer-inner" style="max-width:1100px;margin:0 auto;padding:0 32px;">
    <span class="footer-copy">© 2026 eywa.lol</span>
    <div class="footer-links">
      <a href="terms.html" class="footer-link">Terms</a>
      <a href="privacy.html" class="footer-link">Privacy</a>
    </div>
  </div>
</footer>

<script src="js/loader.js"></script>
<script>
if (localStorage.getItem('eywa_token')) {
  navigateTo('/dashboard', 'Going to dashboard');
}

let pendingEmail = '';

function shakeCard() {
  const card = document.getElementById('authCard');
  card.classList.remove('shake');
  void card.offsetWidth;
  card.classList.add('shake');
}

async function requestCode(isResend) {
  const emailInput = document.getElementById('email');
  const email = isResend ? pendingEmail : emailInput.value.trim();
  const err = isResend ? document.getElementById('resetError') : document.getElementById('emailError');
  const btn = document.getElementById('sendBtn');

  err.textContent = '';

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    if (!isResend) { err.textContent = 'Enter a valid email address.'; shakeCard(); }
    return;
  }

  if (!isResend) { btn.textContent = 'Sending…'; btn.disabled = true; }

  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();

    if (!res.ok) {
      err.textContent = data.error || 'Something went wrong.';
      shakeCard();
      if (!isResend) { btn.textContent = 'Send reset code'; btn.disabled = false; }
      return;
    }

    pendingEmail = email;

    if (isResend) {
      err.style.color = 'var(--accent)';
      err.textContent = 'A new code was sent, if that account exists.';
      setTimeout(() => { err.style.color = ''; err.textContent = ''; }, 3500);
    } else {
      document.getElementById('emailForm').style.display = 'none';
      document.getElementById('resetForm').style.display = 'flex';
      document.getElementById('stepSub').textContent =
        `If an account exists for ${email}, a 6-digit code was just sent to it.`;
      document.getElementById('code').focus();
      btn.textContent = 'Send reset code';
      btn.disabled = false;
    }
  } catch {
    err.textContent = 'Network error. Try again.';
    shakeCard();
    if (!isResend) { btn.textContent = 'Send reset code'; btn.disabled = false; }
  }
}

async function doReset() {
  const code = document.getElementById('code').value.trim();
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const err = document.getElementById('resetError');
  const btn = document.getElementById('resetBtn');

  err.textContent = '';

  if (!/^[0-9]{6}$/.test(code)) { err.textContent = 'Enter the 6-digit code from your email.'; shakeCard(); return; }
  if (newPassword.length < 8) { err.textContent = 'Password must be at least 8 characters.'; shakeCard(); return; }
  if (newPassword !== confirmPassword) { err.textContent = 'Passwords do not match.'; shakeCard(); return; }

  btn.textContent = 'Resetting…';
  btn.disabled = true;

  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: pendingEmail, code, newPassword }),
    });
    const data = await res.json();

    if (!res.ok) {
      err.textContent = data.error || 'Something went wrong.';
      shakeCard();
      btn.textContent = 'Reset password';
      btn.disabled = false;
      return;
    }

    document.getElementById('resetForm').style.display = 'none';
    document.getElementById('doneForm').style.display = 'flex';
    document.getElementById('stepSub').textContent = 'All set — you can log in with your new password.';
  } catch {
    err.textContent = 'Network error. Try again.';
    btn.textContent = 'Reset password';
    btn.disabled = false;
  }
}

function backToEmail() {
  document.getElementById('resetForm').style.display = 'none';
  document.getElementById('emailForm').style.display = 'flex';
  document.getElementById('stepSub').textContent = "Enter your account email and we'll send you a code.";
  document.getElementById('resetError').textContent = '';
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('resetForm').style.display !== 'none') doReset();
  else if (document.getElementById('emailForm').style.display !== 'none') requestCode();
});
</script>
</body>
</html>
